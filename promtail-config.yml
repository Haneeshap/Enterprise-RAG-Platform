server:
  http_listen_port: 3100
  grpc_listen_port: 0

clients:
  - source_labels: [job]
    static_configs:
      - targets:
          - /var/log/app/*.log

scrape_configs:
  - job_name: rag-platform
    static_configs:
      - targets: [localhost]
        labels:
          job: rag-platform
          __path__: /var/log/app/*.log
          service: rag-platform